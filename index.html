<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KIRA · 오늘의 카드뉴스</title><meta name="description" content="키라쨩&픽셀쨩의 오늘의 경제·시사와 AI 브리핑"><link rel="icon" href="kira-icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="kira-icon.png"><meta name="theme-color" content="#faf9f7">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#191f28;background:#faf9f7;letter-spacing:-.035em}.shell{max-width:960px;margin:auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:clamp(12px,3vh,32px) clamp(16px,4vw,48px);gap:clamp(10px,2vh,24px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:44px;height:44px}h1{font-size:clamp(19px,3vw,28px);margin:0}header p{font-size:12px;margin:5px 0 0}button{border:1px solid #ddd9e4;background:white;border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;flex-shrink:0}main{display:grid;grid-template-rows:1fr 1fr;gap:clamp(10px,2vh,22px);flex:1;min-height:0}.edition{--accent:#147d64;--tint:#eaf6ee;background:white;border:1px solid #ecebe8;border-radius:28px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:clamp(16px,3vh,32px);min-height:0;overflow:hidden;box-shadow:0 8px 24px #191f2805}.ai{--accent:#7950d9;--tint:#f2edfc}.copy{min-width:0;flex:1}.label{font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:800}h2{font-size:clamp(23px,4vw,38px);margin:10px 0}.description{font-size:14px;margin:0 0 14px;line-height:1.5}.status{font-size:12px;color:var(--accent);margin:0 0 12px;line-height:1.5}.open{display:inline-flex;align-items:center;min-height:44px;border-radius:14px;background:var(--accent);color:white;text-decoration:none;font-size:14px;font-weight:700;padding:11px 18px}a:focus-visible,button:focus-visible{outline:3px solid #d59000;outline-offset:3px}[hidden]{display:none!important}.preview{height:100%;width:32%;max-width:210px;object-fit:contain;border-radius:12px}.symbol{font-size:clamp(36px,7vw,70px);border-radius:24px;background:var(--tint);padding:18px}footer{font-size:11px;display:flex;justify-content:space-between;gap:8px}@media(max-width:480px){.edition{border-radius:22px;gap:8px;padding:16px}.description{font-size:12px}.brand img{width:36px;height:36px}.label{font-size:9px}header p{font-size:11px}}@media(max-height:500px){.shell{padding:8px 18px;gap:6px}h1{font-size:18px}header .brand img{width:30px;height:30px}main{gap:8px}.edition{padding:10px 20px;border-radius:18px}h2{font-size:22px;margin:3px 0}.description{display:none}.status{display:inline-block;margin:0 10px 0 0}.open{min-height:36px;padding:8px 12px}.label{font-size:9px}footer{font-size:10px}}
.shell{padding:10px 16px;gap:10px}.edition{flex-direction:column;padding:10px;gap:6px;border-radius:18px}.copy{flex:none;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}.label,.description{display:none}h2{font-size:16px;margin:0}.status{font-size:11px;margin:0}.open{flex:1;min-height:0;width:100%;padding:0;background:transparent;border-radius:8px;display:flex;justify-content:center;overflow:hidden}.preview{width:100%;height:100%;max-width:none;object-fit:contain;border-radius:0}.symbol{margin:auto}.open:focus-visible{outline-offset:-3px}footer{font-size:10px}@media(max-height:500px){header p,footer{display:none}.shell{gap:5px;padding:5px 12px}.edition{padding:5px;gap:3px}h2{font-size:13px}}
.bookmark{width:100%;min-height:48px;height:48px;border:0;border-radius:14px;background:#fff0c2;color:#493300;font-size:17px;font-weight:800}.bookmark-dialog{border:0;border-radius:22px;padding:24px;max-width:min(420px,90vw);color:#191f28;line-height:1.65}.bookmark-dialog::backdrop{background:#191f2866}.bookmark-dialog h2{font-size:21px}.bookmark-dialog button{width:100%;border-radius:12px;font-size:16px}.bookmark-dialog p{font-size:15px}
</style></head><body><div class="shell"><header><div class="brand"><img src="kira-icon.svg" alt="KIRA"><div><h1>오늘의 카드뉴스 🐾</h1><p id="today">서울 시간 기준으로 확인 중</p></div></div><button id="refresh" aria-label="발행 상태 새로고침">↻</button></header><button class="bookmark" id="bookmark">⭐ 즐겨찾기 추가 · 매일 여기서 보기</button><main>
<section class="edition" id="economy" aria-labelledby="economy-title"><div class="copy"><span class="label">MORNING · ECONOMY</span><h2 id="economy-title">💚 경제·시사</h2><p class="description">세상의 흐름과 내일의 경제를 읽어요.</p><p class="status" role="status">오늘 발행본 확인 중…</p><a class="open" hidden>오늘의 10장 보기 ↗</a></div><span class="symbol" aria-hidden="true">↗</span><img class="preview" hidden alt="오늘의 경제·시사 표지"></section>
<section class="edition ai" id="ai" aria-labelledby="ai-title"><div class="copy"><span class="label">DAILY · ARTIFICIAL INTELLIGENCE</span><h2 id="ai-title">💜 AI·에이전트</h2><p class="description">새로운 기술, 숫자와 근거까지 함께.</p><p class="status" role="status">오늘 발행본 확인 중…</p><a class="open" hidden>오늘의 10장 보기 ↗</a></div><span class="symbol" aria-hidden="true">✦</span><img class="preview" hidden alt="오늘의 AI 표지"></section>
</main><footer><span>키라쨩 & 픽셀쨩 · BUILDERS LAB</span><span>매일 이 주소에서 ✦</span></footer><noscript>오늘의 자동 조회에는 자바스크립트가 필요합니다.</noscript></div>
<script>
const bookmarkDialog=document.createElement('dialog');
bookmarkDialog.className='bookmark-dialog';
bookmarkDialog.innerHTML='<h2>⭐ KIRA 즐겨찾기</h2><p>웹페이지가 즐겨찾기를 자동으로 추가할 수는 없어요. 아래 방법으로 저장해 주세요.</p><p><strong>아이폰 · 아이패드</strong><br>Safari의 공유 버튼 → 즐겨찾기 추가<br>홈 화면에 추가하면 KIRA 아이콘으로 열 수 있어요.</p><p><strong>안드로이드</strong><br>Chrome의 ⋮ 메뉴 → ☆ 북마크<br>홈 화면에 추가도 가능해요.</p><p><strong>PC</strong><br>Windows: Ctrl + D · Mac: ⌘ + D</p><form method="dialog"><button autofocus>확인</button></form>';
document.body.append(bookmarkDialog);
document.querySelector('#bookmark').onclick=()=>bookmarkDialog.showModal();
let revision=0;
document.querySelectorAll('.edition').forEach(section=>{const link=section.querySelector('a'),img=section.querySelector('.preview');link.setAttribute('aria-label',section.querySelector('h2').textContent+' 카드뉴스 10장 열기');link.replaceChildren(img);section.append(link);});
async function refresh(){
 const run=++revision,date=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
 document.querySelector('#today').textContent=date.replaceAll('-','. ')+' · 매일 만나는 두 가지 브리핑';
 await Promise.all(['economy','ai'].map(async edition=>{
  const section=document.getElementById(edition),link=section.querySelector('a'),img=section.querySelector('img'),status=section.querySelector('.status'),symbol=section.querySelector('.symbol');
  link.hidden=true;img.hidden=true;symbol.hidden=false;status.textContent='오늘 발행본 확인 중…';
  const path=date+(edition==='economy'?'/economy/':'/');
  try{
   const r=await fetch(path+'index.html',{cache:'no-store',signal:AbortSignal.timeout(15000)});
   if(run!==revision)return;
   if(r.status===404){status.textContent='오늘의 브리핑 준비 중 · '+('오전 6시')+' 발송 목표';return;}
   if(!r.ok)throw Error();
   const html=await r.text();if(run!==revision)return;
   if(!html.includes("const date='"+date+"'"))throw Error();
   link.href=path;link.hidden=false;status.textContent='오늘 발행 · 카드뉴스 10장';
   img.onload=()=>{if(run===revision){img.hidden=false;symbol.hidden=true;}};
   img.onerror=()=>{if(run===revision){img.hidden=true;symbol.hidden=false;}};
   img.src='assets/'+date+'/'+(edition==='economy'?'economy/':'')+encodeURIComponent(date+(edition==='economy'?'_경제시사':'')+'_카드뉴스_01.png');
  }catch{if(run===revision)status.textContent='확인하지 못했어요. ↻ 버튼으로 다시 확인해 주세요.';}
 }));
}
document.querySelector('#refresh').onclick=refresh;
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
setInterval(()=>{if(!document.hidden)refresh();},300000);refresh();
</script></body></html>
